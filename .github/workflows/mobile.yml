# Checks and builds the native Stall app (Flutter, in mobile/) on every change.
# By hand (Actions → "Native app" → Run workflow) you can set the version for a Google Play upload.
# Download "stall-native-…" at the bottom of a run: app-release.apk installs on any Android phone for testing,
# app-release.aab is for Google Play.
name: Native app

on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (a whole number, 1 higher than the last upload to Google Play)'
        required: true
        default: '1'
      versionName:
        description: 'Version name shown to users (e.g. 2.0.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Check the code
        run: flutter analyze
      - name: Run the tests
        run: flutter test

      # Same upload key as the Trusted Web Activity (android/), so this app can replace it on Google Play.
      # Without the key, builds are signed with a throwaway debug key: they still install on phones for testing.
      - name: Use the upload key
        env:
          KEYSTORE_B64: ${{ secrets.STALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "STALL_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No upload key in secrets, so this build uses a test key: fine for trying on a phone, not for Google Play."
          fi

      - name: Build
        env:
          STALL_KEYSTORE_PASSWORD: ${{ secrets.STALL_KEYSTORE_PASSWORD }}
          STALL_KEY_ALIAS: ${{ secrets.STALL_KEY_ALIAS }}
          STALL_KEY_PASSWORD: ${{ secrets.STALL_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number="${{ inputs.versionCode || github.run_number }}" --build-name="${{ inputs.versionName || '2.0.0' }}"
          flutter build appbundle --release --build-number="${{ inputs.versionCode || github.run_number }}" --build-name="${{ inputs.versionName || '2.0.0' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: stall-native-${{ inputs.versionName || github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
