# Checks and builds the native Stall app (Flutter, in mobile/) on every change.
# By hand (Actions → "Native app" → Run workflow) you can set the version for a Google Play upload.
# Download "stall-native-…" at the bottom of a run: app-release.apk installs on any Android phone for testing,
# app-release.aab is for Google Play.
# Automatic updates: once Google Play is set up (docs/AUTO_UPDATES.md), every change to the app merged into main
# is sent to the Google Play internal testing track, and testers' phones update by themselves.
name: Native app

on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (a whole number, 1 higher than the last upload to Google Play)'
        required: true
        default: '1'
      versionName:
        description: 'Version name shown to users (e.g. 2.0.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_ON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && 'yes' || '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      # Automatic builds count up from 1000, above any version code uploaded by hand.
      - name: Version
        env:
          IN_CODE: ${{ inputs.versionCode }}
          IN_NAME: ${{ inputs.versionName }}
        run: |
          echo "VERSION_CODE=${IN_CODE:-$((1000 + GITHUB_RUN_NUMBER))}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${IN_NAME:-2.0.$GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Check the code
        run: flutter analyze
      - name: Run the tests
        run: flutter test

      # Same upload key as the Trusted Web Activity (android/), so this app can replace it on Google Play.
      # Without the key, builds are signed with a throwaway debug key: they still install on phones for testing.
      - name: Use the upload key
        env:
          KEYSTORE_B64: ${{ secrets.STALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "STALL_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No upload key in secrets, so this build uses a test key: fine for trying on a phone, not for Google Play."
          fi

      - name: Build
        env:
          STALL_KEYSTORE_PASSWORD: ${{ secrets.STALL_KEYSTORE_PASSWORD }}
          STALL_KEY_ALIAS: ${{ secrets.STALL_KEY_ALIAS }}
          STALL_KEY_PASSWORD: ${{ secrets.STALL_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number="$VERSION_CODE" --build-name="$VERSION_NAME"
          flutter build appbundle --release --build-number="$VERSION_CODE" --build-name="$VERSION_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: stall-native-${{ env.VERSION_NAME }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Only real upload-key builds of main go to Google Play; pull requests and test-key builds never do.
      - name: Send to Google Play (internal testing)
        if: env.PLAY_ON == 'yes' && env.STALL_KEYSTORE_FILE != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ng.com.stall.app
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          # 'draft' until the app's first release is reviewed by Google, then 'completed' (repository variable PLAY_RELEASE_STATUS).
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ env.VERSION_NAME }}
