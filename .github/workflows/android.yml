# Builds the Stall Android app (a Trusted Web Activity) from android/.
# Runs on every change to android/, and by hand from Actions → "Android app" → Run workflow,
# where you can set the version for a Google Play upload.
name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (a whole number, 1 higher than the last upload to Google Play)'
        required: true
        default: '1'
      versionName:
        description: 'Version name shown to users (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Only the Android 16 SDK pieces the app needs (the old default "tools" package no longer exists).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # The upload key lives in GitHub secrets, never in the repo (see android/README.md).
      - name: Use the upload key
        env:
          KEYSTORE_B64: ${{ secrets.STALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "STALL_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "::notice::No upload key in secrets yet, so this build uses a test key: the .apk installs on phones for testing, but it's not for Google Play. Run the 'Android upload key' workflow first (see android/README.md)."
          fi

      - name: Build
        env:
          STALL_KEYSTORE_PASSWORD: ${{ secrets.STALL_KEYSTORE_PASSWORD }}
          STALL_KEY_ALIAS: ${{ secrets.STALL_KEY_ALIAS }}
          STALL_KEY_PASSWORD: ${{ secrets.STALL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -PversionCode="${{ inputs.versionCode || '1' }}" -PversionName="${{ inputs.versionName || '1.0.0' }}"

      - name: Show the signing fingerprint (for Admin → Settings → Android app)
        if: env.STALL_KEYSTORE_FILE != ''
        env:
          STALL_KEYSTORE_PASSWORD: ${{ secrets.STALL_KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore "$STALL_KEYSTORE_FILE" -storepass "$STALL_KEYSTORE_PASSWORD" | grep -E "SHA256:" | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: stall-android-${{ inputs.versionName || 'build' }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
